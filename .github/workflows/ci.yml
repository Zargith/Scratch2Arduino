name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libwebkit2gtk-4.1-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            generator=() ; werror=OFF
          else
            generator=(-G Ninja) ; werror=ON
          fi
          cmake -S . -B build "${generator[@]}" -DCMAKE_BUILD_TYPE=Release \
            -DS2A_BUILD_TESTS=ON -DS2A_WARNINGS_AS_ERRORS=$werror

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install (smoke test)
        shell: bash
        run: |
          cmake --install build --config Release --prefix "$RUNNER_TEMP/s2a"
          find "$RUNNER_TEMP/s2a" -maxdepth 3 | head -n 50

      - name: Compile Blink and the example projects for every board with the installed s2a-cli
        shell: bash
        run: |
          cli="$RUNNER_TEMP/s2a/bin/s2a-cli"
          "$cli" version
          "$cli" setup
          for board in uno nano mega; do
            "$cli" compile examples/sketches/blink --board "$board" --lang en --verbose
            for project in examples/projects/*/project.json; do
              "$cli" compile "$project" --board "$board" --lang en --verbose
            done
          done

  data:
    name: Data files (JSON schema)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate block catalogs
        run: pipx run check-jsonschema --schemafile blocks/schema/catalog.schema.json blocks/catalog/*.json

  frontend:
    name: Block editor (frontend)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - name: Install
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Type check
        run: pnpm --dir frontend typecheck
      - name: Unit tests
        run: pnpm --dir frontend test
      - name: Build
        run: |
          pnpm --dir frontend exec vite build
          (cd frontend/dist && zip -qr ../../scratch2arduino-frontend.zip .)
      - uses: actions/upload-artifact@v7
        with:
          name: frontend
          path: scratch2arduino-frontend.zip

  install-scripts:
    name: install.sh and Makefile (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - name: install.sh --user
        run: ./install.sh --user --yes

      - name: install.sh --user again (update skips the dependencies and reuses the build)
        run: |
          ./install.sh --user --yes | tee second-run.log
          grep -q "Dependencies already installed\|Dépendances déjà installées" second-run.log

      - name: Check installed files
        run: |
          test -x "$HOME/.local/bin/scratch2arduino"
          test -f "$HOME/.local/share/applications/scratch2arduino.desktop"
          test -f "$HOME/.local/share/icons/hicolor/scalable/apps/scratch2arduino.svg"

      - name: install.sh --uninstall
        run: |
          ./install.sh --user --uninstall
          test ! -e "$HOME/.local/bin/scratch2arduino"

      - name: make, make test, make install, make uninstall
        run: |
          make PREFIX="$RUNNER_TEMP/make-prefix"
          make test
          make install
          test -x "$RUNNER_TEMP/make-prefix/bin/scratch2arduino"
          make uninstall
          test ! -e "$RUNNER_TEMP/make-prefix/bin/scratch2arduino"

  windows-installer:
    name: installer.exe (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - name: Build the block editor (shipped prebuilt in installer.exe)
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer.exe
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\windows\scratch2arduino.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run installer.exe silently
        run: |
          $process = Start-Process -FilePath installer\windows\Output\installer.exe -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\setup.log"
          if ($process.ExitCode -ne 0) { throw "installer.exe exited with $($process.ExitCode)" }
          $app = Join-Path $env:ProgramFiles 'Scratch2Arduino'
          Get-Content (Join-Path $app 'install-log.txt') -Tail 40
          if (-not (Test-Path (Join-Path $app 'bin\scratch2arduino.exe'))) { throw 'scratch2arduino.exe was not installed' }

      - name: Run installer.exe again (incremental update)
        run: |
          $watch = [Diagnostics.Stopwatch]::StartNew()
          $process = Start-Process -FilePath installer\windows\Output\installer.exe -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\setup-update.log"
          if ($process.ExitCode -ne 0) { throw "installer.exe exited with $($process.ExitCode)" }
          $app = Join-Path $env:ProgramFiles 'Scratch2Arduino'
          $log = Get-Content (Join-Path $app 'install-log.txt')
          $log | Select-Object -Last 25
          Write-Host "Update took $([int]$watch.Elapsed.TotalSeconds) s"
          if (-not ($log -match 'Previous build found|Compilation précédente trouvée')) { throw 'the update rebuilt everything' }
          if (-not ($log -match '^==> 0 (file|fichier)')) { throw 'unchanged sources were copied again' }
          if (-not (Test-Path (Join-Path $app 'bin\scratch2arduino.exe'))) { throw 'scratch2arduino.exe is missing after the update' }
          if (Test-Path (Join-Path $app 'staging')) { throw 'the staging folder was not removed' }

      - name: Upload installer.exe
        uses: actions/upload-artifact@v7
        with:
          name: installer-windows
          path: installer/windows/Output/installer.exe

      - name: Collect logs
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path installer-logs | Out-Null
          Copy-Item "$env:RUNNER_TEMP\setup*.log" installer-logs -ErrorAction SilentlyContinue
          Copy-Item "$env:ProgramFiles\Scratch2Arduino\install-log.txt" installer-logs -ErrorAction SilentlyContinue

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installer-logs
          path: installer-logs
          if-no-files-found: ignore

  release:
    name: Release (main)
    # Publishes vX.Y.Z (version from CMakeLists.txt) once every other job of a push to main passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, data, frontend, install-scripts, windows-installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^ *VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt | head -n 1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already released: bump VERSION in CMakeLists.txt to publish a new release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download installer.exe
        if: steps.version.outputs.exists == 'false'
        uses: actions/download-artifact@v8
        with:
          name: installer-windows
          path: dist

      - name: Download the prebuilt block editor
        if: steps.version.outputs.exists == 'false'
        uses: actions/download-artifact@v8
        with:
          name: frontend
          path: dist

      - name: Create the GitHub release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Builds from source without Node.js download the frontend archive (cmake/S2AFrontend.cmake).
          mv dist/scratch2arduino-frontend.zip "dist/scratch2arduino-frontend-$VERSION.zip"
          gh release create "v$VERSION" dist/installer.exe "dist/scratch2arduino-frontend-$VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "Scratch2Arduino $VERSION" \
            --generate-notes \
            --prerelease=$([ "${VERSION%%.*}" = 0 ] && echo true || echo false)
