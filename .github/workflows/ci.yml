name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.3"

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config qt6-base-dev libgl-dev libwebkit2gtk-4.1-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt ninja
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> "$GITHUB_ENV"

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            generator=() ; werror=OFF ; prefix_path="-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"
          else
            generator=(-G Ninja) ; werror=ON ; prefix_path=""
          fi
          cmake -S . -B build "${generator[@]}" -DCMAKE_BUILD_TYPE=Release \
            -DS2A_BUILD_TESTS=ON -DS2A_WARNINGS_AS_ERRORS=$werror $prefix_path

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install (smoke test)
        shell: bash
        run: |
          cmake --install build --config Release --prefix "$RUNNER_TEMP/s2a"
          find "$RUNNER_TEMP/s2a" -maxdepth 3 | head -n 50

      - name: Compile Blink for every board with the installed s2a-cli
        shell: bash
        run: |
          cli="$RUNNER_TEMP/s2a/bin/s2a-cli"
          "$cli" version
          "$cli" setup
          for board in uno nano mega; do
            "$cli" compile examples/sketches/blink --board "$board" --lang en --verbose
          done

  data:
    name: Data files (JSON schema)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate block catalogs
        run: pipx run check-jsonschema --schemafile blocks/schema/catalog.schema.json blocks/catalog/*.json

  install-scripts:
    name: install.sh and Makefile (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: install.sh --user
        run: ./install.sh --user --yes

      - name: Check installed files
        run: |
          test -x "$HOME/.local/bin/scratch2arduino-webview"
          test -x "$HOME/.local/bin/scratch2arduino-native"
          test -f "$HOME/.local/share/applications/scratch2arduino-webview.desktop"
          test -f "$HOME/.local/share/applications/scratch2arduino-native.desktop"
          test -f "$HOME/.local/share/icons/hicolor/scalable/apps/scratch2arduino.svg"

      - name: install.sh --uninstall
        run: |
          ./install.sh --user --uninstall
          test ! -e "$HOME/.local/bin/scratch2arduino-webview"
          test ! -e "$HOME/.local/bin/scratch2arduino-native"

      - name: make, make test, make install, make uninstall
        run: |
          make PREFIX="$RUNNER_TEMP/make-prefix"
          make test
          make install
          test -x "$RUNNER_TEMP/make-prefix/bin/scratch2arduino-webview"
          test -x "$RUNNER_TEMP/make-prefix/bin/scratch2arduino-native"
          make uninstall
          test ! -e "$RUNNER_TEMP/make-prefix/bin/scratch2arduino-webview"

  windows-installer:
    name: installer.exe (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer.exe
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\windows\scratch2arduino.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run installer.exe silently
        run: |
          $process = Start-Process -FilePath installer\windows\Output\installer.exe -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\setup.log"
          if ($process.ExitCode -ne 0) { throw "installer.exe exited with $($process.ExitCode)" }
          $app = Join-Path $env:ProgramFiles 'Scratch2Arduino'
          Get-Content (Join-Path $app 'install-log.txt') -Tail 40
          foreach ($exe in 'scratch2arduino-webview.exe', 'scratch2arduino-native.exe') {
            if (-not (Test-Path (Join-Path $app "bin\$exe"))) { throw "$exe was not installed" }
          }

      - name: Upload installer.exe
        uses: actions/upload-artifact@v7
        with:
          name: installer-windows
          path: installer/windows/Output/installer.exe

      - name: Collect logs
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path installer-logs | Out-Null
          Copy-Item "$env:RUNNER_TEMP\setup.log" installer-logs -ErrorAction SilentlyContinue
          Copy-Item "$env:ProgramFiles\Scratch2Arduino\install-log.txt" installer-logs -ErrorAction SilentlyContinue

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installer-logs
          path: installer-logs
          if-no-files-found: ignore

  release:
    name: Release (main)
    # Publishes vX.Y.Z (version from CMakeLists.txt) once every other job of a push to main passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, data, install-scripts, windows-installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^ *VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt | head -n 1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already released: bump VERSION in CMakeLists.txt to publish a new release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download installer.exe
        if: steps.version.outputs.exists == 'false'
        uses: actions/download-artifact@v8
        with:
          name: installer-windows
          path: dist

      - name: Create the GitHub release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/installer.exe \
            --target "$GITHUB_SHA" \
            --title "Scratch2Arduino $VERSION" \
            --generate-notes \
            --prerelease=$([ "${VERSION%%.*}" = 0 ] && echo true || echo false)
