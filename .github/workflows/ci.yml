name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libwebkit2gtk-4.1-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            generator=() ; werror=OFF
          else
            generator=(-G Ninja) ; werror=ON
          fi
          cmake -S . -B build "${generator[@]}" -DCMAKE_BUILD_TYPE=Release \
            -DS2A_BUILD_TESTS=ON -DS2A_WARNINGS_AS_ERRORS=$werror

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install (smoke test)
        shell: bash
        run: |
          cmake --install build --config Release --prefix "$RUNNER_TEMP/s2a"
          find "$RUNNER_TEMP/s2a" -maxdepth 3 | head -n 50

      - name: Compile Blink, the Live firmware and the example projects for every board with the installed s2a-cli
        shell: bash
        run: |
          cli="$RUNNER_TEMP/s2a/bin/s2a-cli"
          "$cli" version
          for board in uno nano mega; do
            "$cli" setup --board "$board"
            "$cli" compile examples/sketches/blink --board "$board" --lang en --verbose
            "$cli" compile firmware/s2a_live --board "$board" --lang en --verbose
            for project in examples/projects/*/project.json; do
              # The ESP32 examples use ESP32 pin numbers: compiled in the ESP32 step below.
              grep -q '"board": "esp32"' "$project" && continue
              "$cli" compile "$project" --board "$board" --lang en --verbose
            done
          done
          # ESP32: its tools are big, so it is checked on Linux only. The Arduino examples use
          # Arduino pin names (A0...): only the ESP32 examples are compiled for it.
          if [ "$RUNNER_OS" = "Linux" ]; then
            "$cli" setup --board esp32
            "$cli" compile examples/sketches/blink --board esp32 --lang en --verbose
            "$cli" compile firmware/s2a_live --board esp32 --lang en --verbose
            for project in $(grep -l '"board": "esp32"' examples/projects/*/project.json); do
              "$cli" compile "$project" --board esp32 --lang en --verbose
            done
          fi

  data:
    name: Data files (JSON schema)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate block catalogs
        run: pipx run check-jsonschema --schemafile blocks/schema/catalog.schema.json blocks/catalog/*.json

  frontend:
    name: Block editor (frontend)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - name: Install
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Type check
        run: pnpm --dir frontend typecheck
      - name: Unit tests
        run: pnpm --dir frontend test
      - name: Build
        run: |
          pnpm --dir frontend exec vite build
          (cd frontend/dist && zip -qr ../../scratch2arduino-frontend.zip .)
      - uses: actions/upload-artifact@v7
        with:
          name: frontend
          path: scratch2arduino-frontend.zip

  install-scripts:
    name: Scratch2Arduino_installer.sh and Makefile (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - name: Scratch2Arduino_installer.sh --user
        run: ./Scratch2Arduino_installer.sh --user --yes

      - name: Scratch2Arduino_installer.sh --user again (update skips the dependencies and reuses the build)
        run: |
          ./Scratch2Arduino_installer.sh --user --yes | tee second-run.log
          grep -q "Dependencies already installed\|Dépendances déjà installées" second-run.log

      - name: Check installed files
        run: |
          test -x "$HOME/.local/bin/scratch2arduino"
          test -f "$HOME/.local/share/applications/scratch2arduino.desktop"
          test -f "$HOME/.local/share/icons/hicolor/256x256/apps/scratch2arduino.png"
          test -f "$HOME/.local/share/icons/hicolor/512x512/apps/scratch2arduino.png"

      - name: Scratch2Arduino_installer.sh --uninstall
        run: |
          ./Scratch2Arduino_installer.sh --user --uninstall
          test ! -e "$HOME/.local/bin/scratch2arduino"

      - name: make, make test, make install, make uninstall
        run: |
          make PREFIX="$RUNNER_TEMP/make-prefix"
          make test
          make install
          test -x "$RUNNER_TEMP/make-prefix/bin/scratch2arduino"
          make uninstall
          test ! -e "$RUNNER_TEMP/make-prefix/bin/scratch2arduino"

  windows-installer:
    name: Scratch2Arduino_installer.exe (Windows)
    runs-on: windows-latest
    env:
      # Code signing (Windows SmartScreen): set the secrets WINDOWS_CERTIFICATE (base64 of a .pfx)
      # and WINDOWS_CERTIFICATE_PASSWORD to sign the installer; without them it stays unsigned.
      HAS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - name: Build the block editor (shipped prebuilt in Scratch2Arduino_installer.exe)
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Scratch2Arduino_installer.exe
        run: |
          # Scratch2Arduino_installer.exe takes its version from CMakeLists.txt.
          $version = (Select-String -Path CMakeLists.txt -Pattern '^\s*VERSION ([0-9.]+)$' | Select-Object -First 1).Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\windows\scratch2arduino.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign Scratch2Arduino_installer.exe
        if: env.HAS_CERTIFICATE == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 `
            /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD installer\windows\Output\Scratch2Arduino_installer.exe
          $code = $LASTEXITCODE
          Remove-Item $pfx
          if ($code -ne 0) { exit $code }

      - name: Run Scratch2Arduino_installer.exe silently
        run: |
          # The build log is shown while the installer runs.
          & .github\scripts\run-installer.ps1 -SetupLog "$env:RUNNER_TEMP\setup.log"
          if ($LASTEXITCODE -ne 0) { throw "Scratch2Arduino_installer.exe exited with $LASTEXITCODE" }
          $app = Join-Path $env:ProgramFiles 'Scratch2Arduino'
          if (-not (Test-Path (Join-Path $app 'bin\scratch2arduino.exe'))) { throw 'scratch2arduino.exe was not installed' }

      - name: Run Scratch2Arduino_installer.exe again (incremental update)
        run: |
          & .github\scripts\run-installer.ps1 -SetupLog "$env:RUNNER_TEMP\setup-update.log"
          if ($LASTEXITCODE -ne 0) { throw "Scratch2Arduino_installer.exe exited with $LASTEXITCODE" }
          $app = Join-Path $env:ProgramFiles 'Scratch2Arduino'
          $log = Get-Content (Join-Path $app 'install-log.txt')
          if (-not ($log -match 'Previous build found|Compilation précédente trouvée')) { throw 'the update rebuilt everything' }
          if (-not ($log -match '^==> 0 (file|fichier)')) { throw 'unchanged sources were copied again' }
          if (-not (Test-Path (Join-Path $app 'bin\scratch2arduino.exe'))) { throw 'scratch2arduino.exe is missing after the update' }
          if (Test-Path (Join-Path $app 'staging')) { throw 'the staging folder was not removed' }

      - name: The installer refuses to update while Scratch2Arduino is open
        run: |
          $app = Join-Path $env:ProgramFiles 'Scratch2Arduino\bin\scratch2arduino.exe'
          $running = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 5
          if ($running.HasExited) {
            Write-Host "::warning::scratch2arduino.exe could not stay open on the runner: check skipped"
            exit 0
          }
          $process = Start-Process -FilePath installer\windows\Output\Scratch2Arduino_installer.exe -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\setup-running.log"
          Stop-Process -Id $running.Id -Force
          Get-Content "$env:RUNNER_TEMP\setup-running.log" -Tail 15
          if ($process.ExitCode -eq 0) { throw 'the installer ran while Scratch2Arduino was open' }

      - name: Upload Scratch2Arduino_installer.exe
        uses: actions/upload-artifact@v7
        with:
          name: installer-windows
          path: installer/windows/Output/Scratch2Arduino_installer.exe

      - name: Collect logs
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path installer-logs | Out-Null
          Copy-Item "$env:RUNNER_TEMP\setup*.log" installer-logs -ErrorAction SilentlyContinue
          Copy-Item "$env:ProgramFiles\Scratch2Arduino\install-log.txt" installer-logs -ErrorAction SilentlyContinue

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installer-logs
          path: installer-logs
          if-no-files-found: ignore

  release:
    name: Release (main)
    # Publishes vX.Y.Z (version from CMakeLists.txt) once every other job of a push to main passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, data, frontend, install-scripts, windows-installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^ *VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt | head -n 1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already released: bump VERSION in CMakeLists.txt to publish a new release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Scratch2Arduino_installer.exe
        if: steps.version.outputs.exists == 'false'
        uses: actions/download-artifact@v8
        with:
          name: installer-windows
          path: dist

      - name: Download the prebuilt block editor
        if: steps.version.outputs.exists == 'false'
        uses: actions/download-artifact@v8
        with:
          name: frontend
          path: dist

      - name: Create the GitHub release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Builds from source without Node.js download the frontend archive (cmake/S2AFrontend.cmake).
          mv dist/scratch2arduino-frontend.zip "dist/scratch2arduino-frontend-$VERSION.zip"
          gh release create "v$VERSION" dist/Scratch2Arduino_installer.exe "dist/scratch2arduino-frontend-$VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "Scratch2Arduino $VERSION" \
            --generate-notes \
            --prerelease=$([ "${VERSION%%.*}" = 0 ] && echo true || echo false)
